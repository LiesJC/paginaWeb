<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>Redes Interactivas</title>

    <style>

        body {
            font-family: Arial;
            margin: 0;
            background: #f1f5f9;
        }

        header {
            background: #1e3a8a;
            color: white;
            text-align: center;
            padding: 50px;
        }

        .contenedor {
            width: 90%;
            max-width: 900px;
            margin: 40px auto;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px #ccc;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #resultado {
            margin-top: 20px;
            padding: 20px;
            background: #dbeafe;
            border-radius: 8px;
            display: none;
        }

    </style>

</head>

<body>

<header>

    <h1>Redes de Computadoras</h1>

    <p>Página interactiva</p>

</header>

<div class="contenedor">

    <div class="card">

        <h2>¿Qué es una red?</h2>

        <p>
            Una red permite que diferentes dispositivos
            intercambien información.
        </p>

        <button onclick="mostrarInformacion()">
            Ver información
        </button>

        <div id="resultado">

            <h3>Elementos de una red</h3>

            <ul>

                <li>Dispositivos</li>
                <li>Medios de transmisión</li>
                <li>Protocolos</li>
                <li>Direcciones IP</li>
                <li>Servicios de red</li>

            </ul>

        </div>

    </div>

</div>

<script>

function mostrarInformacion() {

    const resultado = document.getElementById("resultado");

    if (resultado.style.display === "none" ||
        resultado.style.display === "") {

        resultado.style.display = "block";

    } else {

        resultado.style.display = "none";

    }

}

</script>

</body>

</html>
